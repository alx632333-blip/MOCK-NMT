<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НМТ · English · Mock exam</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--pink:#ffffff;--opt:#ffffff;--ink:#2b2420;--ac:#2b2420;--ac2:#f5eee7;--peach:#fbe3e3;--sage:#ffffff;--line:#d9c7b5;--sh:#eadfd3;--sel:#f1eaff;--flag:#7b2cff;--ok:#7fe0b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif}
h1,.hand{font-family:Archivo;color:var(--ac);margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--pink);z-index:5}
.top h1{font-size:20px;font-weight:900;letter-spacing:.03em;text-transform:uppercase}
#timer{font:800 22px Archivo,sans-serif;background:#fff;border:2px solid var(--line);box-shadow:3px 3px 0 var(--sh);padding:2px 14px}
#timer.low{background:var(--peach);animation:p 1s infinite}@keyframes p{50%{transform:scale(1.06)}}
.ins{padding:10px 16px;font-weight:800;font-size:15px;color:var(--ink)}
.lay{display:grid;grid-template-columns:1.25fr 1fr 300px;gap:16px;padding:0 16px 24px;align-items:start}
@media(max-width:1000px){.lay{grid-template-columns:1fr}}
.box{background:var(--card);border:2px solid var(--line);border-radius:2px;box-shadow:5px 5px 0 var(--sh);padding:16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pan{max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:70px}
@media(max-width:1000px){.pan{position:static;max-height:none}}
.pan h3{margin:0 0 10px;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.pp{display:flex;gap:10px;margin:8px 0}.pn{flex:none;border:2px solid var(--line);border-radius:6px;width:26px;height:26px;text-align:center;font-weight:800;font-size:14px;line-height:22px}
.sh{border:2px solid var(--line);border-radius:2px;padding:8px 12px;margin:8px 0;background:var(--sage);font-size:15px}.sh b.t{font-size:13px;letter-spacing:.06em}
.sh.cur{background:var(--ac2);border-color:var(--ac)}
.qn{display:flex;align-items:center;gap:10px}.qn .n{font:800 52px/1 Archivo;color:var(--ac)}
.tag{background:#fff;border:2px solid var(--line);border-radius:6px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.06em}
.qt{font-size:18px;font-weight:700;margin:10px 0 12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--opt);color:var(--ink);border-radius:2px;padding:8px 12px;margin:0 0 8px;font:inherit;text-align:left;cursor:pointer;transition:.15s;box-shadow:3px 3px 0 var(--sh)}
.opt:hover{transform:translate(-1px,-1px)}.opt.on{background:var(--sel);border-color:var(--flag);box-shadow:3px 3px 0 var(--flag)}
.opt i{flex:none;font-style:normal;font-weight:800;border:2px solid var(--line);border-radius:6px;width:28px;height:28px;text-align:center;line-height:24px;background:#fff}
.sm{background:var(--opt);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font:800 12px Manrope;letter-spacing:.05em;cursor:pointer}
.sm.on{background:var(--flag);color:#fff;border-color:var(--flag)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:2px;padding:10px 20px;font:800 14px Archivo;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 var(--flag)}
.btn.g{background:var(--opt);color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn:disabled{opacity:.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bar{background:#fff;height:14px;border:2px solid var(--line);border-radius:8px;overflow:hidden}.bar div{height:100%;background:var(--ok);transition:.3s}
.gr{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.gr button{width:38px;height:38px;border:2px solid var(--line);background:var(--opt);color:var(--ink);border-radius:8px;font:800 14px Manrope;cursor:pointer}
.gr .d{background:var(--ok)}.gr .f{outline:3px solid var(--flag);outline-offset:1px}.gr .c{background:var(--ink);color:#fff;border-color:var(--ink)}
.lg{font-size:12px;display:flex;gap:10px;flex-wrap:wrap}.lg s{display:inline-block;width:12px;height:12px;border:1px solid var(--line);margin-right:4px;text-decoration:none;vertical-align:-1px}
.gap{background:#fff;border:2px solid var(--line);border-radius:4px;padding:0 8px;font-weight:800}.gap.cur{background:var(--flag);color:#fff;border-color:var(--flag)}
.res li{list-style:none;margin:4px 0}.ok{color:#1f9a68}.no{color:#c43a5a}.big{font:800 60px Archivo;color:var(--ac)}
</style></head><body>
<div class="top"><h1>НМТ · English · Mock exam</h1><div style="display:flex;gap:10px;align-items:center"><button class="btn" id="st" onclick="startT()">▶ Старт</button><div id="timer">60:00</div></div></div>

<script>
const L='ABCDEFGH';
const TX=['Planning a family celebration? Our restaurant has a private room for up to 40 guests, a children’s corner, balloons and a birthday cake made to order. We help you invite relatives and organise games. Book at least two weeks in advance!','We are looking for a friendly waiter for weekends. No experience is necessary, but you must be polite, sociable and reliable. You will receive training in the first week and a free lunch every shift. Send your CV to jobs@cafearoma.org.','Looking for an exciting holiday for your teenager? Our camp near the sea offers sports, drama and music for ages 12–16. Children live in small groups with qualified instructors. Registration closes on 1 June, and places are limited.','Is your phone out of order? Come to Fix-It Saturday at the town library! Volunteers repair broken headphones, laptops and chargers for free and explain how to replace a battery. Bring your device and a friend; no booking needed.','Meet astronauts, touch a real meteorite and see a model of the solar system! The exhibition is open every day from 10 a.m. Children under twelve enter free, and school groups can book a guided tour with a short film about space travel.'];
const RT=['Until last year I was the quiet boy at the back of the class. I was never very confident, and I preferred playing computer games alone to hanging out with classmates. My parents often told me to be more sociable, but I only felt embarrassed. Then my cousin Nina, who studies engineering, gave me an old broken e-reader for my birthday and said: “Fix it, if you are not too busy.”','I took it as a joke, but that evening I opened the manual and started to read. It took me three weeks, countless videos and one terrible argument with my father, who thought I was wasting electricity. Finally the screen lit up. I had never felt so proud, and I immediately wanted to try something harder.','A friend told me about the school robotics club. I almost did not go because I was afraid that everybody would be smarter than me. In fact, they were friendly and patient. A girl called Hana showed me how to connect a sensor to a small robot, and we laughed when it crashed into the wall. Since then I go to the club every Thursday, and we are building a robot for a national contest.','I still get nervous before speaking in public, and I am not sure we will win. However, I have learned that mistakes are normal and that asking for help is a sign of strength, not weakness. Next month we are going to travel to Kyiv for the final, and, to my mind, that is already a great result.'];
const S3=[['FAMILY TREE PROJECT','Pupils at a school in Lviv are asking their grandparents about their childhood and recording the stories on tablets. They draw a family tree for each class and add old photos. Teachers say the project helps children understand their ancestors and feel closer to relatives of all generations.'],['MOON NIGHT','Every month the local observatory invites visitors to look through large telescopes at planets and comets. Astronomers explain how gravity works and answer questions. Tickets are free for children under twelve, and the evenings often finish with a short film about space exploration.'],['FIX-IT SATURDAY','Volunteers in the town library repair broken phones, headphones and laptops for free. Many people throw away faulty gadgets, but the volunteers show owners how to find the problem and replace a battery or a charger. The group hopes to produce less electronic waste.'],['NEW NEIGHBOURS','When a family moves into the street, the residents bring a house-warming gift and invite them to a small party. It started after a woman felt lonely in her new flat. Now people say they get on with each other better and often get together at weekends.'],['THE SHY CLUB','This weekly meeting is for teenagers who find it hard to talk to strangers. Instructors teach simple ways to start a conversation, and members practise by chatting online and then in person. After a few months, most of them feel more confident and make new friends.'],['ROBOT AT SCHOOL','A small robot now helps pupils with maths in a school in Odesa. It never gets impatient, repeats explanations as many times as necessary and records the progress of every child. Teachers use the data to plan lessons, but they say the robot cannot replace a human.']];
const ST=['A machine supports learning.','Volunteers help to save old devices.','Residents have become friendlier.','Visitors can watch the sky and learn about it.','Participants can get a job after training.','Children learn about earlier generations.','It helps people who are not sociable.','Visitors can rent a film for free.'];
const G=[null,null,null,
'<h3>A year that changed my cousin</h3>Last month, my cousin Max decided to move to a new city, [17]. Everyone in the family was surprised, because he had always been a very shy and quiet boy. His mother wanted him to stay at home, but Max needed time to become independent.<br><br>He spent the first weeks working in a small shop, and [18]. Then he signed up for a volunteer programme at a care home, where he met people of all generations. In the mornings he talked to the residents; in the afternoons he helped [19]. “I had never felt so useful before,” he told me on the phone.<br><br>Life alone was not always easy. Max missed his relatives and sometimes felt lonely, but we chatted online every Sunday, [20]. On the plus side, he got on well with his flatmates and learned to manage his money.<br><br>When he visited us at Easter, he surprised us again. Max is now planning to study medicine, [21]. He says that the experience taught him that [22].',
'<h3>A new gadget</h3>Last month my dad bought a new [23] – a satnav for the car. Before you use it, you should read the [24] carefully, plug it [25] the socket and press the [26]. Yesterday it suddenly made a funny noise and [27], so we took it back to the shop.',
'<h3>Olga’s busy life</h3>Olga [28] a pretty important exam next week. She never [29] to bed before midnight, and at the moment she [30] for it in her room. When I called her yesterday, she [31] lunch. I am sure she [32] a great result.'];
const T=[
{i:'Read the advertisements (1–5). Choose what each advertisement is about (A–H). There are three options you do not need.',qs:[['',4],['',5],['',1],['',2],['',6]],o:['a second-hand book sale for charity','a summer camp for teenagers','a gadget repair workshop','a flat to rent for students','a family party venue','a part-time job in a café','a space exhibition for children','a fitness club for beginners']},
{i:'Read the text below. For questions (6–10) choose the correct answer (A, B, C or D).',qs:[['What did the writer prefer before joining the club?',['playing computer games alone','hanging out with classmates','going to parties','helping his parents'],0],['Why did his father argue with him?',['Leo was too noisy','He thought Leo was wasting electricity','Leo broke the e-reader','Leo skipped school'],1],['Why did the writer almost not go to the club?',['He was too busy','He was afraid others were smarter','His father said no','He disliked robots'],1],['What happened to the robot when Hana helped him?',['It stopped working','It crashed into the wall','It was lost','It was stolen'],1],['What has the writer learned?',['Asking for help is weakness','Mistakes should be hidden','Asking for help shows strength','Winning is everything'],2]]},
{i:'Read the texts (11–16) and match them with the statements (A–H). There are two statements you do not need.',qs:S3.map((s,k)=>[s[0],[5,3,1,2,6,0][k]]),o:ST},
{i:'Read the text below. For questions (17–22) choose the phrase that fits each space (A–H). There are two phrases you do not need.',qs:[2,4,1,5,0,6],o:['because he wants to care for elderly people','to cook lunch and organise games','instead of staying with his parents','who is two years older than me','he saved almost every penny he earned','even though the internet connection was often poor','friendship and kindness matter more than money','to repair the school building']},
{i:'Read the text below. For questions (23–27) choose the correct answer (A, B, C or D).',qs:[[['gadget','engine','virus','socket'],0],[['manual','model','site','comet'],0],[['into','in','over','to'],0],[['button','link','password','channel'],0],[['broke down','went flat','launched','discovered'],0]]},
{i:'Read the text below. For questions (28–32) choose the correct answer (A, B, C or D).',qs:[[['has','is having','have','having'],0],[['goes','is going','went','will go'],0],[['studies','is studying','studied','will study'],1],[['was having','has','will have','is having'],0],[['will get','gets','got','is getting'],0]]}];
const Q=[];T.forEach((t,ti)=>t.qs.forEach(q=>Q.push(ti<3?{ti,q:q[0],o:t.o||q[1],a:q[ti==1?2:1]}:ti==3?{ti,q:null,o:t.o,a:q}:{ti,q:null,o:q[0],a:q[1]})));
const N=Q.length,ans=Array(N).fill(null),flag=Array(N).fill(false);let cur=0,left=3600,fin=false,started=false,tm,deadline,strikes=0,away=false;
const $=id=>document.getElementById(id);
const first=ti=>Q.findIndex(x=>x.ti==ti);
function pan(){const q=Q[cur],ti=q.ti;
 if(ti==0)return TX.map((t,i)=>`<div class="sh ${i==cur?'cur':''}" style="display:flex;gap:12px"><b style="font:700 30px/1 Archivo;color:var(--ac)">${i+1}</b><span>${t}</span></div>`).join('');
 if(ti==1)return `<h3>My year of discoveries</h3>`+RT.map((t,i)=>`<div class="pp"><span class="pn">${i+1}</span><span>${t}</span></div>`).join('');
 if(ti==2)return `<h3>Short texts</h3>`+S3.map((s,i)=>`<div class="sh ${first(2)+i==cur?'cur':''}"><b class="t">${11+i}. ${s[0]}</b><br>${s[1]}</div>`).join('');
 return G[ti].replace(/\[(\d+)\]/g,(m,n)=>{const v=ans[n-1];return `<span class="gap ${n==cur+1?'cur':''}">${v==null?n:Q[n-1].ti==3?L[v]:Q[n-1].o[v]}</span>`})}
function show(){
 const q=Q[cur],ti=q.ti,num=cur+1,txtOpt=ti>2||ti==1||ti==2;
 const done=ans.filter(x=>x!=null).length;
 const stat=`<div class="box"><b style="font-size:13px">ANSWERED ${done} OF ${N}</b><span style="float:right;color:var(--flag);font-weight:800;font-size:13px">LEFT ${N-done}</span><div class="bar" style="margin-top:8px"><div style="width:${done/N*100}%"></div></div></div>`;
 const rng=[[1,5],[6,10],[11,16],[17,22],[23,27],[28,32]];
 const grid=`<div class="box" style="margin-top:14px"><b>QUESTIONS</b>`+rng.map((r,k)=>`<div style="font-size:11px;font-weight:800;opacity:.6;margin-top:8px">TASK ${k+1}</div><div class="gr">${Array.from({length:r[1]-r[0]+1},(_,j)=>{const i=r[0]-1+j;return `<button class="${i==cur?'c':ans[i]!=null?'d':''} ${flag[i]?'f':''}" onclick="cur=${i};show()">${i+1}</button>`}).join('')}</div>`).join('')+`<div class="lg"><span><s style="background:var(--ink)"></s>current</span><span><s style="background:var(--ok)"></s>answered</span><span><s></s>unanswered</span><span><s style="border-color:var(--flag)"></s>come back</span></div></div><button class="btn" style="width:100%;margin-top:14px" onclick="end(true)">SUBMIT EXAM</button>`;
 const opts=q.o.map((t,i)=>`<button class="opt ${ans[cur]===i?'on':''}" onclick="pick(${i})"><i>${L[i]}</i><span>${t}</span></button>`).join('');
 const lb=t=>`<div style="font-size:12px;letter-spacing:.08em;opacity:.6;font-weight:800;margin-top:8px">${t}</div>`;
 const qt=ti==0?lb('ADVERTISEMENT '+num)+'<div class="qt" style="margin-top:2px">Which advertisement is about ________?</div>':ti==3?lb('SPACE ('+num+')')+'<div class="qt" style="margin-top:2px">Choose the phrase that fits.</div>':ti<3?`<div class="qt">${ti==2?'<span class="hand" style="font-size:24px">Text:</span> ':''}${q.q}</div>`:`${lb('SPACE ('+num+')')}<div class="qt" style="margin-top:2px">Choose the correct word or phrase.</div>`;
 $('app').innerHTML=`<div class="ins">${T[ti].i}</div><div class="lay"><div class="box pan">${pan()}</div><div><div class="box"><div class="qn"><span class="n">${num}</span><span class="tag">TASK ${ti+1}</span><span style="margin-left:auto;color:var(--ink);opacity:.6;font-size:13px">of ${N}</span></div>${qt}${opts}<div style="display:flex;justify-content:space-between;margin:6px 0"><button class="sm ${flag[cur]?'on':''}" onclick="flag[cur]=!flag[cur];show()">COME BACK LATER</button><button class="sm" style="border:0;opacity:.6" onclick="ans[cur]=null;show()">CLEAR ANSWER</button></div><div class="g2"><button class="btn g" onclick="go(-1)" ${cur?'':'disabled'}>← BACK</button><button class="btn" onclick="go(1)" ${cur<N-1?'':'disabled'}>NEXT →</button></div></div></div><div>${stat}${grid}</div></div>`}
function startT(){if(started||fin)return;started=true;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}deadline=Date.now()+left*1000;$('st').style.display='none';tm=setInterval(tick,1000)}
function pick(i){startT();ans[cur]=i;show()}
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));show()}
function end(ask,msg){
 if(ask){const u=ans.filter(x=>x==null).length;if(!confirm(u?`Без відповіді: ${u}. Завершити тест?`:'Завершити тест?'))return}
 fin=true;clearInterval(tm);let s=0;const pt=[0,0,0,0,0,0];
 const li=Q.map((q,i)=>{const ok=ans[i]===q.a;s+=ok;pt[q.ti]+=ok;const f=x=>x==null?'—':L[x]+' · '+String(q.o[x]).slice(0,40);
  return `<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${i+1}. ваша: ${f(ans[i])} → правильна: ${f(q.a)}</li>`}).join('');
 $('app').innerHTML=`<div class="lay" style="grid-template-columns:1fr"><div class="box" style="text-align:center"><h1>Тест завершено</h1><div class="big">${s} / ${N}</div>${msg?`<p class="no"><b>${msg}</b></p>`:''}<p>Task 1: ${pt[0]}/5 · Task 2: ${pt[1]}/5 · Task 3: ${pt[2]}/6 · Task 4: ${pt[3]}/6 · Task 5: ${pt[4]}/5 · Task 6: ${pt[5]}/5<br>Поріг «склав» у НМТ — 5 тестових балів.</p></div><div class="box res"><ul style="padding:0">${li}</ul><button class="btn" onclick="location.reload()">Пройти ще раз</button></div></div>`;scrollTo({top:0})}
function tick(){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));const m=Math.floor(left/60),s=left%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('low',left<=300);if(left<=0){alert('Час вийшов! Тест завершено.');end(false)}}
function warn(){let w=document.getElementById('warn');if(!w){w=document.createElement('div');w.id='warn';w.style.cssText='position:fixed;inset:0;background:rgba(27,19,64,.7);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';document.body.appendChild(w)}
 w.innerHTML=`<div class="box" style="max-width:420px;text-align:center"><h1 style="font-size:22px">⚠ ПОПЕРЕДЖЕННЯ ${strikes}/3</h1><p>Ви залишили вкладку з тестом. Під час іспиту це заборонено. Після 3-го попередження тест буде завершено автоматично.</p><button class="btn" onclick="this.closest('#warn').remove()">Повернутися до тесту</button></div>`}
let bl,T0=document.title;
function leave(){if(started&&!fin){away=true;clearInterval(bl);bl=setInterval(()=>{document.title=document.title==T0?'⚠ Поверніться до тесту!':T0},700)}}
function back(){clearInterval(bl);document.title=T0;if(!away||fin)return;away=false;strikes++;if(strikes>=3){const w=document.getElementById('warn');if(w)w.remove();end(false,'Тест завершено: ви 3 рази залишили вкладку.')}else warn()}
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);window.addEventListener('focus',()=>{if(!document.hidden)back()});
window.addEventListener('beforeunload',e=>{if(started&&!fin){e.preventDefault();e.returnValue=''}});
function soft(){if(!started||fin||document.getElementById('warn'))return;const w=document.createElement('div');w.id='warn';w.style.cssText='position:fixed;inset:0;background:rgba(43,36,32,.65);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';w.innerHTML='<div class="box" style="max-width:420px;text-align:center"><h1 style="font-size:22px">⚠ НЕ ЗАЛИШАЙТЕ ТЕСТ</h1><p>Закривати вкладку або перемикатися на іншу під час іспиту заборонено. Кожен вихід з вкладки рахується як попередження (зараз: '+strikes+'/3).</p><button class="btn" onclick="this.closest(\'#warn\').remove()">Продовжити тест</button></div>';document.body.appendChild(w)}
document.addEventListener('mouseleave',e=>{if(e.clientY<=0)soft()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)soft()});
document.addEventListener('keydown',e=>{if(started&&!fin&&(e.ctrlKey||e.metaKey)&&['w','t','n','Tab'].includes(e.key))soft()});
show();
</script></body></html>
